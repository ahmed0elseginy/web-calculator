<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Calculator</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 10px;
            min-height: 100vh;
            background: #1a1a1a;
            font-family: system-ui, sans-serif;
            display: flex;
            justify-content: center; /* توسيط أفقي */
            align-items: center; /* توسيط عمودي */

        }

        .calc {
            width: 350px;          /* عرض ثابت */
            padding: 15px;
            background: #2a2a2a;
            border-radius: 10px;
        }

        .display {
            background: #333;
            color: #fff;
            font-size: 2.5rem;
            text-align: right;
            padding: 20px;
            border-radius: 12px 12px 0 0;
        }

        .keys {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 1px;
            background: #222;
            padding: 1px;
            border-radius: 0 0 12px 12px;
        }

        .keys button {
            height: 60px;
            font-size: 1.5rem;
            border: none;
            cursor: pointer;
            background: #333;
            color: #fff;
        }

        .keys button:hover {
            background: #444;
        }

        .keys .op {
            background: #ff9500;
            color: #fff;
        }

        .keys .op:hover {
            background: #ffad33;
        }

        .keys .ac {
            background: #505050;
        }

        .keys .zero {
            grid-column: span 2;
        }

        .keys .eq {
            grid-column: span 2;
            background: #ff9500;
            color: #fff;
        }
    </style>
</head>
<body>
<div class="calc">
    <div class="display" th:text="${display}">0</div>
    <form method="post" action="calculator" class="keys">
        <input type="hidden" name="display" th:value="${display}">
        <button type="submit" name="key" value="C" class="ac">C</button>
        <button type="submit" name="key" value="7">7</button>
        <button type="submit" name="key" value="8">8</button>
        <button type="submit" name="key" value="9">9</button>
        <button type="submit" name="key" value="/" class="op">/</button>
        <button type="submit" name="key" value="4">4</button>
        <button type="submit" name="key" value="5">5</button>
        <button type="submit" name="key" value="6">6</button>
        <button type="submit" name="key" value="*" class="op">*</button>
        <button type="submit" name="key" value="1">1</button>
        <button type="submit" name="key" value="2">2</button>
        <button type="submit" name="key" value="3">3</button>
        <button type="submit" name="key" value="-" class="op">-</button>
        <button type="submit" name="key" value="0" class="zero">0</button>
        <button type="submit" name="key" value=".">.</button>
        <button type="submit" name="key" value="+" class="op">+</button>
        <button type="submit" name="key" value="=" class="eq">=</button>
    </form>
</div>
</body>
</html>
